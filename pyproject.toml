[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synod-ai"
version = "0.1.0"
description = "Synod AI backend"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "langchain-mcp-adapters",
    "mcp",
    "httpx",
    "tenacity",
    "cachetools",
    "cryptography",
    "fastapi",
    "PyJWT",
    "langchain-core",
    "langfuse",
    "langgraph",
    "langsmith",
    "openai",
    "pydantic",
    "pydantic-settings",
    "SQLAlchemy",
    "sse-starlette",
    "uvicorn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-mock",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
